name: Auto Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: silver-tapir-929419.hostingersite.com
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 22
          script: |
            cd ~/domains/silver-tapir-929419.hostingersite.com/public_html/EmailsequnceFullstack || cd ~/public_html/EmailsequnceFullstack || exit 1
            
            echo "📥 Pulling latest code from GitHub..."
            git pull origin main
            
            echo "📦 Installing backend dependencies..."
            cd backend
            npm install 2>&1
            
            echo "🔄 Regenerating Prisma client..."
            npx prisma generate 2>&1
            
            echo "📦 Installing frontend dependencies..."
            cd ../emailseq-frontend
            npm install 2>&1
            
            echo "🏗️ Building frontend..."
            npm run build 2>&1
            
            echo "✅ Deployment successful!"
